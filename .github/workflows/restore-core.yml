name: restore-core
# 臨時修復 workflow：把自己誤覆寫的 js/core.js 從 git 歷史還原。
# 執行一次後，workflow 會在同一筆 commit 裡刪除自己，不會留下殘留。
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 從 52e953c 還原 js/core.js 並把 BUILD 升到 6.4.0
        run: |
          set -e
          git checkout 52e953ca9f3def99e91d7a7cd39dca97a7eba68e -- js/core.js
          sed -i "s|var BUILD = 'LHBS build 6.3.0 / cache v39'|var BUILD = 'LHBS build 6.4.0 / cache v40'|" js/core.js
          echo "--- 還原後檢查 ---"
          grep -n "var BUILD" js/core.js
          wc -c js/core.js

      - name: 提交並移除本 workflow
        run: |
          set -e
          git rm -f .github/workflows/restore-core.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "還原 js/core.js（67,170 bytes，BUILD 6.4.0 / cache v40），並移除臨時修復 workflow [skip ci]"
          git push
