# GitHub Pages 部署工作流程（建議使用）
#
# 用途：取代 Settings → Pages → Deploy from a branch 的舊式建置。
# 舊式建置偶爾會延遲或漏掉觸發，導致「檔案已上傳但網站還是舊版」。
# 改用這個工作流程後，每次 push 都會明確、可追蹤地重新部署。
#
# 安裝方式：
#   1. 在專案根目錄建立資料夾 .github/workflows/
#   2. 把這個檔案複製進去並改名為 pages.yml
#      （路徑要是 .github/workflows/pages.yml）
#   3. 到 Settings → Pages，Source 改選 "GitHub Actions"
#   4. 之後每次 push 到 main，Actions 分頁都會出現一次部署紀錄

name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
